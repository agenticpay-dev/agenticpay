name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly

permissions:
  contents: read

env:
  # gitleaks itself is MIT. Only the gitleaks-action wrapper requires a paid
  # licence once the repo is owned by an organization, which it now is, so we
  # run the binary directly. Version and checksum are pinned: this workflow is
  # a supply-chain control, and a control that silently pulls "latest" from the
  # internet is not one.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$file" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum -c -
          tar -xzf "$file" gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Scan full history
        run: ./gitleaks git . --redact --verbose --exit-code 1
